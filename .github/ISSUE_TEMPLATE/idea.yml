name: 共创提案
description: 提出一个需求、项目想法，或寻找共创伙伴
title: "[共创] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 请描述实际场景与目前的处理方式，勿填写真实案件或个人敏感信息。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望做到什么程度？
      description: 什么结果会对你有帮助？怎样判断它是否有效？
    validations:
      required: true
  - type: textarea
    id: participation
    attributes:
      label: 你愿意参与什么，需要哪些帮助？
      description: 例如业务经验、需求梳理、测试、文档、设计或开发。
