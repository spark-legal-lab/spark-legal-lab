name: 申请加入
description: 申请成为星火法律实验室的共建协作者
title: "[加入申请] "
body:
  - type: markdown
    attributes:
      value: "欢迎加入！提交后维护者会收到仓库通知，审核后按需要发出协作邀请。请留意回复与邀请。申请内容公开可见，请勿填写手机号等个人敏感信息。"
  - type: textarea
    id: introduction
    attributes:
      label: 简单介绍一下自己和想参与的方向
      description: 可以填写希望分享什么、想一起做什么；不要求会编程。维护者会使用提交本申请的 GitHub 账号发出邀请。
    validations:
      required: true
